name: Check hosted Scan collection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Install pinned collector dependency
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check capture validation
        run: npm test
      - name: Install stock Chromium
        run: npx playwright install --with-deps chromium
      - name: Collect and validate Scan response
        run: timeout --signal=TERM --kill-after=5s 55s npm run collect
      - name: Upload validated capture
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: scan-capture
          path: data/latest.json
          if-no-files-found: error
          retention-days: 3
